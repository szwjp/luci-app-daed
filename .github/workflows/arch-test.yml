name: Arch test

# 静态门禁：不依赖 OpenWrt SDK、不依赖外网，3 分钟内跑完。
# 在 PR / push-to-main / workflow_dispatch / workflow_call 触发；
# build.yml 用 workflow_call 让 release 走同一份门禁，避免两套实现漂移。
#
# 检查项：
#   1) i18n 覆盖率（po/zh_Hans 必须 100% 翻译所有 pot msgid）
#   2) Makefile 关键字段齐整（PKG_NAME/PKG_VERSION/PKG_RELEASE/HASH 等）
#   3) daed 包能解析到 PKG_HASH（脚本层面的"是否对齐"哨兵，不下二进制）
#   4) YAML / 脚本语法

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: arch-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  arch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: i18n coverage (zh_Hans)
        run: python3 tests/i18n_coverage.py --fail-below 100

      - name: Makefile sanity checks
        # gh api 需要显式给 token：GitHub runner 上没有已存的 gh 凭据，
        # 不设 GH_TOKEN 时 gh 会直接失败（本地开发机因为有 gh auth 登录所以看不出来）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          get_mk() { sed -nE "s/^[[:space:]]*$1:=(.*)/\1/p" "$2" | head -1 | tr -d ' \r'; }

          # 关键字段非空
          for v in PKG_NAME PKG_VERSION PKG_RELEASE; do
            [ -n "$(get_mk "$v" daed/Makefile)" ] \
              || { echo "::error::daed/Makefile 缺 ${v}"; exit 1; }
            [ -n "$(get_mk "$v" luci-app-daed/Makefile)" ] \
              || { echo "::error::luci-app-daed/Makefile 缺 ${v}"; exit 1; }
          done

          # daed 包的 PKG_VERSION 必须是 YYYY.MM.DD（opkg/apk 靠它判断升级；
          # 写成 2.1.1 这种永远升不上去，见 daed/Makefile 里关于 apk 版本比较的说明）
          DV="$(get_mk PKG_VERSION daed/Makefile)"
          if [[ ! "$DV" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$ ]]; then
            echo "::error::daed/Makefile PKG_VERSION='$DV' 不是 YYYY.MM.DD（应先跑 scripts/release-sync.sh）"
            exit 1
          fi

          # luci-app-daed 的版本不强制日期，但必须让 apk 版本比较赢过官方包：
          # 设备上官方 luci-app-daed 是 26.236.50544~cb5d434，实测
          #   apk version -t 2.1.1-r1      26.236.50544~cb5d434  →  <  降级
          #   apk version -t 2026.10.16-r1 26.236.50544~cb5d434  →  >  升级
          # 这里只警告不失败（维护者可以有意选择 2.1.1，代价是可能被 feed 覆盖）。
          LV="$(get_mk PKG_VERSION luci-app-daed/Makefile)"
          case "$LV" in
            [0-9][0-9][0-9][0-9].*) ;;
            *) echo "::warning::luci-app-daed PKG_VERSION=$LV 数值小于官方 ImmortalWrt 包的 26.x：apk 会判降级，之后 apk upgrade 可能被 feed 的官方包覆盖。详见 luci-app-daed/Makefile 顶部注释" ;;
          esac

          # PKG_HASH 不能是 skip（发布构建时必须有）。长度 64 hex = 256-bit SHA-256。
          HASH="$(get_mk PKG_HASH daed/Makefile)"
          if [ -z "$HASH" ] || [ "$HASH" = "skip" ]; then
            echo "::error::daed/Makefile PKG_HASH 不能为空或 skip（先跑 scripts/release-sync.sh 同步 szwjp/daed release）"
            exit 1
          fi
          if [[ ! "$HASH" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::daed/Makefile PKG_HASH 必须是 64 位 hex（实际长度 ${#HASH}: $HASH）"
            exit 1
          fi

          # DAED_RELEASE_TAG 必须存在且对应真实 release；PKG_SOURCE_URL 必须指向它。
          TAG="$(get_mk DAED_RELEASE_TAG daed/Makefile)"
          if [[ ! "$TAG" =~ ^v[0-9].*-nightly-[0-9]{8}$ ]]; then
            echo "::error::daed/Makefile DAED_RELEASE_TAG='$TAG' 不是 v*-nightly-YYYYMMDD"
            exit 1
          fi
          # PKG_SOURCE_URL 通常写成 .../download/$(DAED_RELEASE_TAG)，这里把
          # make 变量引用展开后再比对（shell 不做 make 的变量展开）
          SRC_URL="$(get_mk PKG_SOURCE_URL daed/Makefile)"
          SRC_URL_EXPANDED="${SRC_URL//'$(DAED_RELEASE_TAG)'/$TAG}"
          case "$SRC_URL_EXPANDED" in
            *"/download/$TAG"*) ;;
            *) echo "::error::PKG_SOURCE_URL 与 DAED_RELEASE_TAG 不一致：展开后=$SRC_URL_EXPANDED tag=$TAG"; exit 1 ;;
          esac
          if ! gh api "repos/szwjp/daed/releases/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::szwjp/daed 没有 release ${TAG}，先到 szwjp/daed 触发一次 build 或跑 release-sync"
            exit 1
          fi
          # 资产必须真的能下载（HEAD 请求，不下载 33MB 正文）
          SRC_FILE="$(get_mk PKG_SOURCE daed/Makefile)"
          ASSET="${SRC_URL_EXPANDED%/}/${SRC_FILE}"
          CODE="$(curl -sSIL -o /dev/null -w '%{http_code}' "$ASSET")"
          if [ "$CODE" != "200" ]; then
            echo "::error::release 资产不可下载（HTTP $CODE）：$ASSET"
            exit 1
          fi
          echo "版本检查通过：daed $DV ($TAG), hash ${HASH:0:8}…, 资产 HTTP $CODE"

          # 交叉校验：arch-test 的 PKG_VERSION（YYYY.MM.DD）应与 tag 里的日期一致
          TAG_DATE="${TAG##*-nightly-}"
          EXPECT_DATE="${TAG_DATE:0:4}.${TAG_DATE:4:2}.${TAG_DATE:6:2}"
          if [ "$DV" != "$EXPECT_DATE" ]; then
            echo "::error::PKG_VERSION=$DV 与 DAED_RELEASE_TAG=$TAG 的日期 $EXPECT_DATE 不一致"
            exit 1
          fi

      - name: Shell / YAML syntax
        run: |
          set -euo pipefail
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$f" ] || continue
            python3 -c "import yaml,sys;yaml.safe_load(open(sys.argv[1]));print('YAML OK',sys.argv[1])" "$f" \
              || { echo "::error::$f YAML 解析失败"; exit 1; }
          done
          bash -n scripts/release-sync.sh
          bash -n .github/build-pkg.sh 2>/dev/null || true
          echo "全部语法检查通过"
