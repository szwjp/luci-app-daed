name: Release Sync

# 每 2 小时（UTC 偶数整点）轮询 szwjp/daed 最新 nightly release。
# 逻辑全部在 scripts/release-sync.sh 里（幂等：已同步则直接退出 0），
# 这样本地手动跑和 CI 跑的是同一段代码，不会两处漂移。
#
# 脚本会改 daed/Makefile 的 PKG_VERSION / PKG_RELEASE / DAED_RELEASE_TAG /
# PKG_HASH / DAECORE_PIN，以及 luci-app-daed 的 PKG_VERSION / PKG_RELEASE，
# 然后 commit（本 workflow 负责 push）。
#
# 自愈：同步后不论本次是否产生 commit，都算一遍「luci 期望的 release tag」，
# 该 release 不存在就 dispatch build.yml。build 失败 → 2 小时后下一轮自动重试；
# build 成功 → release 已存在，下一轮幂等跳过。
#
# 失败可见性：job 失败时 notify job 开 issue（已有同标题则追加评论）。

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"

permissions:
  contents: write   # push main
  actions: write    # gh workflow run build.yml
  issues: write     # notify job

concurrency:
  group: release-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Sync Makefile to latest szwjp/daed release
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 脚本自己判断「是否已最新」，已最新时 exit 0 且不改文件
          bash scripts/release-sync.sh
          # 判断是否有 commit 产生（脚本只 commit、不 push）
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager log origin/main..HEAD --oneline
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "无变化"
          fi

          # 期望的 release tag = v<luci PKG_VERSION>-r<PKG_RELEASE 两位等宽>。
          # 必须与 build.yml 里的 canon 规则一致（r2 → r02），否则会一直误判
          # 「release 不存在」，每 2 小时 dispatch 一次重复构建。
          MK_V="$(sed -n 's/^PKG_VERSION:=//p' luci-app-daed/Makefile | head -1)"
          MK_R="$(sed -n 's/^PKG_RELEASE:=//p' luci-app-daed/Makefile | head -1)"
          EXPECTED="${MK_V}-r${MK_R}"
          if [[ ! "$EXPECTED" =~ ^[0-9][0-9A-Za-z.]*-r[0-9]+$ ]]; then
            echo "::error::luci-app-daed/Makefile 版本 $EXPECTED 非法"
            exit 1
          fi
          TAG_VERSION="$(printf '%s-r%02d' "${EXPECTED%-r*}" "$((10#${EXPECTED##*-r}))")"
          RELEASE_TAG="v$TAG_VERSION"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "luci 期望 release: $RELEASE_TAG"

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            echo "$RELEASE_TAG 已存在，无需 dispatch"
          else
            echo "dispatch=true" >> "$GITHUB_OUTPUT"
            echo "$RELEASE_TAG 不存在，需要 dispatch build.yml"
          fi

      - name: Push
        if: steps.sync.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git push origin HEAD:main
          echo "已推送到 main"

      # 熔断：build 连续失败时不再每 2 小时重试，避免无限烧构建/刷 issue。
      # 恢复方式：修复后手动 dispatch build.yml 或 push 一次，成功即复位。
      - name: Circuit breaker - build 连续失败熔断
        id: breaker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          N="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?per_page=20" \
                --jq '[.workflow_runs[].conclusion] | reduce .[] as $c ({count:0,done:false};
                        if .done then . elif $c == "success" then .done = true
                        elif $c == "failure" then .count += 1 else . end) | .count')"
          echo "trailing_failures=$N" >> "$GITHUB_OUTPUT"
          if [ "$N" -ge 3 ]; then
            echo "::warning::build 已连续失败 $N 次，本轮暂停自动 dispatch（修复后手动 dispatch/push 一次即可恢复）"
          else
            echo "::notice::build 连续失败 $N 次，未触发熔断"
          fi

      - name: Dispatch build for missing release
        if: steps.sync.outputs.dispatch == 'true' && steps.breaker.outputs.trailing_failures < 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 放在 push 之后：workflow_dispatch 从 main 的最新 commit 起跑，
          # 必须让 build 看到本轮 sync 写进去的版本号
          gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "已 dispatch build.yml（目标 release ${{ steps.sync.outputs.release_tag }}）"

  # 失败可见性：同步失败（比如 daed 侧没有新格式 release、API 抖动、push 冲突）
  # 时确保有一个 open issue 记录。已有同标题只追加评论，避免每 2 小时刷屏。
  notify:
    needs: [sync]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report failure as an issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE="release-sync 自动同步失败"
          BODY="$(printf 'daed → 本仓的自动同步链路失败，需要人工看一下。\n\n- run: %s/%s/actions/runs/%s\n- 提交: %s\n- 事件: %s\n\n排查：run 页面的 Summary → scripts/release-sync.sh 的输出\n（szwjp/daed 是否已发新格式 tag v*-nightly-YYYYMMDD-<fork sha7>-<dae sha7>？API 是否抖动？）\n→ 本仓 build.yml 是否被 dispatch 成功。\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_SHA" "$GITHUB_EVENT_NAME")"
          EXIST="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
                    --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" 2>/dev/null | head -1 || true)"
          if [ -n "$EXIST" ]; then
            # 去重：持续失败时每 2 小时都会走到这里，12 小时内不重复刷评论。
            UPDATED="$(gh issue view "$EXIST" --repo "$GITHUB_REPOSITORY" --json updatedAt --jq '.updatedAt' 2>/dev/null || true)"
            if [ -n "$UPDATED" ]; then
              AGE=$(( $(date +%s) - $(date -d "$UPDATED" +%s) ))
              if [ "$AGE" -lt 43200 ]; then
                echo "::notice::issue #$EXIST 12 小时内已更新过，本轮不重复评论"
                exit 0
              fi
            fi
            gh issue comment "$EXIST" --repo "$GITHUB_REPOSITORY" --body "$BODY"
            echo "已在已有 issue #$EXIST 追加失败记录"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
            echo "已创建失败 issue"
          fi

  # 保活：公开仓库 60 天无活动会被 GitHub 禁用 schedule。只在 HEAD 超过 25 天无提交时补一个提交。
  keepalive:
    needs: [sync]
    if: '!cancelled()'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Keep repository active
        run: |
          set -euo pipefail
          AGE_DAYS=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "HEAD 距今天数: $AGE_DAYS（阈值 25）"
          if [ "$AGE_DAYS" -lt 25 ]; then
            echo "::notice::仓库近 $AGE_DAYS 天有提交，无需保活"
            exit 0
          fi

          git config user.name szwjp
          git config user.email szwjp@users.noreply.github.com
          mkdir -p .github
          printf 'last keepalive: %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .github/keepalive
          git add .github/keepalive
          git commit -q -m "chore: keepalive（公开仓库 60 天无活动会禁用 schedule）"

          for i in 1 2 3; do
            git fetch -q origin main
            git rebase -q origin/main || { git rebase --abort 2>/dev/null || true; echo "::error::rebase 失败"; exit 1; }
            if git push -q origin HEAD:main; then
              echo "已推送保活提交（$AGE_DAYS 天无提交）"
              exit 0
            fi
            echo "push 失败（第 $i 次），重试"
            sleep 5
          done
          echo "::error::保活提交连续 3 次推送失败"
          exit 1

  # 自检（跨仓）：对端 szwjp/daed 的 schedule 是否还活着。
  selfcheck:
    needs: [sync]
    if: '!cancelled()'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Self-check - 对端 schedule 是否存活
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          REPO="szwjp/daed"
          WF="check-upstream.yml"
          TITLE="szwjp/daed 的 schedule 疑似停摆"

          STATE="$(gh api "repos/$REPO/actions/workflows/$WF" --jq .state 2>/dev/null || true)"
          if [ -z "$STATE" ]; then
            echo "::notice::读取对端 workflow 状态失败（网络/限流），本轮跳过自检"
            exit 0
          fi
          LAST="$(gh api "repos/$REPO/actions/workflows/$WF/runs?event=schedule&per_page=1" \
                   --jq '.workflow_runs[0].created_at // empty' 2>/dev/null || true)"
          AGE="?"
          STALE=false
          if [ -n "$LAST" ]; then
            AGE=$(( ( $(date +%s) - $(date -d "$LAST" +%s) ) / 3600 ))
            [ "$AGE" -gt 30 ] && STALE=true
          else
            STALE=true
          fi
          [ "$STATE" != "active" ] && STALE=true
          echo "对端 $REPO/$WF: state=$STATE，最近 schedule 运行 ${AGE}h 前"

          if [ "$STALE" != "true" ]; then
            echo "::notice::对端 schedule 正常"
            exit 0
          fi

          BODY="$(printf '对端仓库的定时任务疑似停摆，需要人工确认。\n\n- 仓库: %s\n- workflow: %s\n- state: %s（期望 active）\n- 最近一次 schedule 运行: %s（阈值 30h）\n\n处理：去 https://github.com/%s/actions 确认；若被 GitHub 以「60 天无活动」禁用，点 Enable workflow。\n本检查由 szwjp/luci-app-daed 的 release-sync 自动执行。\n' \
            "$REPO" "$WF" "$STATE" "${AGE}h 前" "$REPO")"
          EXIST="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
                    --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" 2>/dev/null | head -1 || true)"
          if [ -n "$EXIST" ]; then
            UPDATED="$(gh issue view "$EXIST" --repo "$GITHUB_REPOSITORY" --json updatedAt --jq '.updatedAt' 2>/dev/null || true)"
            if [ -n "$UPDATED" ] && [ $(( $(date +%s) - $(date -d "$UPDATED" +%s) )) -lt 43200 ]; then
              echo "::warning::对端 schedule 异常（12h 内已记录，不重复评论）"
              exit 0
            fi
            gh issue comment "$EXIST" --repo "$GITHUB_REPOSITORY" --body "$BODY"
            echo "::warning::对端 schedule 异常，已在 issue #$EXIST 追加记录"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
            echo "::warning::对端 schedule 异常，已创建 issue"
          fi

  # 恢复自动收尾：同步没有红（skipped 不算失败）时关闭同名失败 issue。
  clear-failure:
    needs: [sync]
    if: '!cancelled() && !failure()'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Close recovered failure issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE="release-sync 自动同步失败"
          N="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
                --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" 2>/dev/null | head -1 || true)"
          [ -n "$N" ] || { echo "::notice::没有未关闭的失败 issue，无需收尾"; exit 0; }
          gh issue comment "$N" --repo "$GITHUB_REPOSITORY" \
            --body "本轮已恢复：$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID。自动关闭。"
          gh issue close "$N" --repo "$GITHUB_REPOSITORY"
          echo "已关闭失败 issue #$N"
