name: Release Sync

# 每日 UTC 01:00（北京时间 09:00）轮询 szwjp/daed 最新 nightly release。
# 逻辑全部在 scripts/release-sync.sh 里（幂等：已同步则直接退出 0），
# 这样本地手动跑和 CI 跑的是同一段代码，不会两处漂移。
#
# 脚本会改 daed/Makefile 的 PKG_VERSION / DAED_RELEASE_TAG / PKG_HASH /
# DAECORE_PIN，并给 luci-app-daed 的 PKG_RELEASE +1，然后 commit（本 workflow 负责 push）。
# commit message 含 [skip release-sync] 时跳过。

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: write

concurrency:
  group: release-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Sync Makefile to latest szwjp/daed release
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 脚本自己判断「是否已最新」，已最新时 exit 0 且不改文件
          bash scripts/release-sync.sh
          # 判断是否有 commit 产生（脚本只 commit、不 push）
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager log origin/main..HEAD --oneline
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "无变化"
          fi

      - name: Push
        if: steps.sync.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git push origin HEAD:main
          echo "已推送到 main"
