<script type="text/javascript">
	//<![CDATA[
	var daed_log_url   = '<%=url([[admin]], [[services]], [[daed]], [[get_log]])%>';
	var daed_clear_url = '<%=url([[admin]], [[services]], [[daed]], [[clear_log]])%>';
	var daed_log_token = '<%=token%>';

	function clear_log(btn) {
		XHR.post(daed_clear_url, { token: daed_log_token }, function(x) {
			var log_textarea = document.getElementById('log_textarea');
			if (x && x.status == 200 && log_textarea) {
				log_textarea.value = "";
			}
			location.reload();
		});
	}

	var scrolled = false;
	XHR.poll(5, daed_log_url, null,
		function(x, data) {
			if (x && x.status == 200) {
				var log_textarea = document.getElementById('log_textarea');
				if (!log_textarea)
					return;
				// 用 value 而不是 innerHTML：日志是纯文本，不能让其中内容被解析成 HTML。
				var at_bottom = log_textarea.scrollTop + log_textarea.clientHeight
					>= log_textarea.scrollHeight - 4;
				log_textarea.value = x.responseText;
				if (!scrolled || at_bottom) {
					log_textarea.scrollTop = log_textarea.scrollHeight;
					scrolled = true;
				}
			}
		}
	);
	//]]>
</script>
<fieldset class="cbi-section" id="_log_fieldset">
	<input class="cbi-button cbi-input-remove" type="button" onclick="clear_log()" value="<%:Clear logs%>" style="margin-left: 10px; margin-top: 10px;">
	<textarea id="log_textarea" class="cbi-input-textarea" style="width: calc(100% - 20px); height: 645px; margin: 10px;" data-update="change" rows="5" wrap="off" readonly="readonly"></textarea>
</fieldset>
